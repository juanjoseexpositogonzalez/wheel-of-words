[project]
name = "wheel-vocabulary"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jsonschema>=4.22",
    # Required by FastAPI to parse multipart uploads. Without it, registering a
    # route with an UploadFile parameter fails at import time, not at request
    # time. REQ-002-001 makes multipart the only accepted intake.
    "python-multipart>=0.0.32",
    "spacy>=3.8.15",
    "en-core-web-sm",
]

[project.optional-dependencies]
dev  = ["wheel-vocabulary[test,lint,type]"]
# httpx2 (not httpx) is the transport starlette.testclient supports going
# forward; the httpx path is deprecated. See issue #15.
test = ["pytest>=8", "pytest-cov>=5", "httpx2>=2", "hypothesis>=6"]
lint = ["ruff>=0.4"]
type = ["mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wheel_vocabulary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--strict-markers -ra"
# Scoped to the warning classes this suite has actively fixed, so neither can
# silently reappear. Deliberately not a blanket `error` /
# `error::DeprecationWarning`, which would fail on unrelated upstream churn.
# StarletteDeprecationWarning subclasses UserWarning, not DeprecationWarning,
# so it must be named explicitly.
# A leaked sqlite3 connection raises ResourceWarning from a GC finalizer, where
# the exception is unraisable; pytest downgrades it to
# PytestUnraisableExceptionWarning. Erroring on ResourceWarning alone therefore
# does NOT fail the run, so both entries are required to close the leak gate.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::starlette.exceptions.StarletteDeprecationWarning",
]
markers   = [
    "unit: pure unit test (no database, no network)",
    "integration: test with SQLite or Alembic",
    "e2e: Playwright end-to-end test",
    "smoke: infrastructure smoke test",
    "bench: T-BENCH synthetic-corpus benchmark (design §3.3-3.5). Runs every CI invocation; deterministic invariants always assert. Wall-clock budget assertions are gated behind WHEEL_BENCH_STRICT=1 and are not part of the default CI job (tasks.md contradiction note 7).",
]

[tool.coverage.run]
source   = ["wheel_vocabulary"]
branch   = true

[tool.coverage.report]
show_missing = true
skip_empty   = true

[tool.ruff]
target-version = "py312"
line-length    = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "PT", "SIM", "RET", "TCH", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["wheel_vocabulary"]

[tool.ruff.lint.per-file-ignores]
# S101: use of assert is expected in pytest test files.
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version      = "3.12"
strict              = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "wheel_vocabulary.domain.*"
strict = true

[[tool.mypy.overrides]]
module = "wheel_vocabulary.application.*"
strict = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
