test_commands:
  backend_all: cd apps/api && uv run pytest
  backend_unit: cd apps/api && uv run pytest tests/unit
  backend_api: cd apps/api && uv run pytest tests/api
  backend_integration: cd apps/api && uv run pytest tests/integration
  backend_smoke: cd apps/api && uv run pytest tests/smoke
  backend_coverage: cd apps/api && uv run pytest --cov=wheel_vocabulary --cov-report=term-missing
  frontend_all: cd apps/web && pnpm run test
  frontend_coverage: cd apps/web && pnpm run test:coverage
  e2e_declared: cd apps/web && pnpm exec playwright test
  all_makefile: make test
  lint_backend: cd apps/api && uv run ruff check .
  lint_frontend: cd apps/web && pnpm run lint
  typecheck_backend: cd apps/api && uv run mypy src/wheel_vocabulary
  typecheck_frontend: cd apps/web && pnpm run typecheck
  format_backend: cd apps/api && uv run ruff format .

testing:
  strict_tdd: true
  detected: 2026-08-10
  runtime_reason: pytest_50_passed_vitest_playwright_ci_8_green_jobs_verified_main_aa3042d
  layers:
    unit:
